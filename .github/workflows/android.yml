name: Android app
# Builds an installable Android APK (debug-signed) from the mobile/ project. For the Play Store you need a release-signed
# bundle: add your keystore as repository secrets and switch the last step to `bundleRelease`.
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npx cap add android && npx cap sync android
      - name: Use our MainActivity (saves the sign-in cookie to disk whenever the app leaves the screen)
        run: cp native/MainActivity.java android/app/src/main/java/com/schoolwell/app/MainActivity.java
      - run: ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: schoolwell-android-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
